# Ping Render free-tier so the web service rarely sleeps (cold-start interstitial).
# Free instances spin down after ~15 minutes idle; this keeps them warm.
name: Keep Render awake

on:
  schedule:
    # Every 10 minutes (UTC)
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake PerspectiveLab API
        env:
          HEALTH_URL: https://perspective-lab.onrender.com/api/healthz
          FALLBACK_URL: https://perspective-lab.onrender.com/api/health
        run: |
          set -e
          ping() {
            local url="$1"
            curl -fsS --max-time 90 -o /tmp/health.json -w "http=%{http_code} time=%{time_total}s url=${url}\n" "$url" || return 1
            head -c 400 /tmp/health.json; echo
          }
          if ! ping "$HEALTH_URL"; then
            echo "healthz failed; trying /api/health"
            ping "$FALLBACK_URL"
          fi
