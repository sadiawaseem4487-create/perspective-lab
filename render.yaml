services:
  - type: web
    name: perspectivelab-api
    runtime: docker
    plan: free
    # Redeploy automatically when main (or the connected branch) receives a commit
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CASE_ID
        value: sao-paulo-dropout
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ORIGINS
        value: "*"
      - key: WORKERS
        value: "1"
      - key: AUTH_REQUIRED
        value: "true"
      - key: EXPORT_API_KEY
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@perspectivelab.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://perspective-lab.onrender.com
