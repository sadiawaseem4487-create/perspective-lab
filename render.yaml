# Accounts live in SQLite under /app/backend/data. Free Render has an ephemeral
# filesystem — every redeploy wiped users. Starter + disk keeps logins forever.
services:
  - type: web
    name: perspectivelab-api
    runtime: docker
    # Persistent disks require a paid instance (not available on free).
    plan: starter
    # Redeploy automatically when main (or the connected branch) receives a commit
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: perspectivelab-data
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CASE_ID
        value: sao-paulo-dropout
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ORIGINS
        value: "*"
      - key: WORKERS
        value: "1"
      - key: AUTH_REQUIRED
        value: "true"
      - key: DATABASE_PATH
        value: /app/backend/data/sessions.db
      - key: EXPORT_API_KEY
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@perspectivelab.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://perspective-lab.onrender.com
