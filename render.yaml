# Durable accounts on free Render: Postgres (not local SQLite).
# SQLite on the web container is wiped on every redeploy / idle spin-down.
databases:
  - name: perspectivelab-db
    plan: free

services:
  - type: web
    name: perspectivelab-api
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CASE_ID
        value: sao-paulo-dropout
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ORIGINS
        value: "*"
      - key: WORKERS
        value: "1"
      - key: AUTH_REQUIRED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: perspectivelab-db
          property: connectionString
      - key: EXPORT_API_KEY
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@perspectivelab.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://perspective-lab.onrender.com
